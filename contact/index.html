<!DOCTYPE html>
<!--
THESIS: Contact is one direct, private action rather than a directory of channels.
OWN-WORLD: Morning-blue atmosphere, deep-water type, one oversized textable number, and the established restrained navigation.
STORY: Visitors arrive, see the single contact method, and can begin a text immediately.
FIRST VIEWPORT: The page title and phone number sit centered in a quiet blue field with no competing content.
FORM: A precisely specified extension of the approved blue concept; no new visual world or interaction model.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Contact Binyan Shalem by text message.">
    <title>Contact Us — Binyan Shalem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;750&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../blue-concept-pages.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <div class="nav-shell">
            <a class="wordmark" href="../" aria-label="Binyan Shalem home">
                <strong>BINYAN SHALEM</strong>
                <span>בנין שלם</span>
            </a>
            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="../">Home</a>
                <a href="../#mission">Our Mission</a>
                <a href="../#contact">Get Help</a>
                <a href="../content/">Shalom Bayit Content</a>
                <a aria-current="page" href="./">Contact Us</a>
                <a class="nav-donate" href="../donate/">Donate</a>
            </nav>
            <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
                </svg>
            </button>
        </div>
    </header>

    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" aria-hidden="true" inert>
        <a href="../">Home</a>
        <a href="../#mission">Our Mission</a>
        <a href="../#contact">Get Help</a>
        <a href="../content/">Shalom Bayit Content</a>
        <a aria-current="page" href="./">Contact Us</a>
        <a href="../donate/">Donate</a>
    </nav>

    <main id="main-content" class="contact-page-main">
        <section class="contact-page" aria-labelledby="contact-page-title">
            <div class="contact-page-shell">
                <h1 class="visually-hidden" id="contact-page-title">Contact us.</h1>
                <div class="contact-details">
                    <p>You can text us at</p>
                    <a class="contact-number" href="sms:3474439477" aria-label="Text Binyan Shalem at 347 443 9477">(347) 443-9477</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-shell">
            <p>© 2026 Binyan Shalem. All Rights Reserved.</p>
            <p><a aria-current="page" href="./">Contact Us</a></p>
        </div>
    </footer>

    <script>
        const menuButton = document.querySelector(".menu-button");
        const mobileMenu = document.getElementById("mobile-menu");

        function setMenu(open, restoreFocus = true) {
            menuButton.setAttribute("aria-expanded", String(open));
            menuButton.setAttribute("aria-label", open ? "Close menu" : "Open menu");
            mobileMenu.classList.toggle("open", open);
            mobileMenu.setAttribute("aria-hidden", String(!open));
            mobileMenu.inert = !open;
            document.body.classList.toggle("menu-open", open);

            if (open) {
                window.setTimeout(() => mobileMenu.querySelector("a").focus(), 0);
            } else if (restoreFocus) {
                menuButton.focus();
            }
        }

        menuButton.addEventListener("click", () => setMenu(menuButton.getAttribute("aria-expanded") !== "true"));
        mobileMenu.addEventListener("click", (event) => {
            if (event.target.closest("a")) setMenu(false, false);
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && menuButton.getAttribute("aria-expanded") === "true") {
                setMenu(false);
            }
        });
    </script>
</body>
</html>
