<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Page Not Found — Binyan Shalem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;750&amp;display=swap" rel="stylesheet">
    <script defer src="/cache-refresh.js?v=2026-08-04.4"></script>
    <style>
        :root {
            --mist: #f4fafd;
            --morning: #e1f0f8;
            --sky: #b9d9ec;
            --deep-water: #244d68;
            --midnight: #142f42;
            --muted: #4e6c7f;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100svh;
            margin: 0;
            color: var(--midnight);
            background:
                radial-gradient(circle at 8% 18%, rgba(185, 217, 236, 0.8) 0 10rem, transparent 10.1rem),
                radial-gradient(circle at 94% 75%, rgba(255, 255, 255, 0.92) 0 13rem, transparent 13.1rem),
                linear-gradient(145deg, var(--morning), var(--mist));
            font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        .shell {
            display: grid;
            place-items: center;
            width: min(100%, 1180px);
            min-height: 100%;
            margin: 0 auto;
            padding: clamp(1.25rem, 4vw, 4.5rem);
        }

        .message {
            width: min(100%, 650px);
            padding: clamp(2rem, 7vw, 4.5rem);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(31, 70, 96, 0.13);
            text-align: center;
        }

        .code {
            margin: 0;
            color: var(--deep-water);
            font-size: 0.85rem;
            font-weight: 700;
        }

        h1 {
            max-width: 12ch;
            margin: 0.6rem auto 1rem;
            font-size: clamp(2.3rem, 8vw, 4.5rem);
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        .message > p:not(.code) {
            max-width: 48ch;
            margin: 0 auto;
            color: var(--muted);
        }

        .return-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            margin-top: 1.8rem;
            padding: 0.8rem 1.4rem;
            color: var(--white);
            background: var(--deep-water);
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(20, 47, 66, 0.2);
        }

        .countdown {
            display: block;
            min-height: 1.5em;
            margin-top: 1rem;
            color: var(--deep-water);
            font-size: 0.82rem;
            font-weight: 600;
        }

        :focus-visible {
            outline: 3px solid #6f9fbd;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="message" aria-labelledby="not-found-title">
            <p class="code">404 · Page not found</p>
            <h1 id="not-found-title">Let’s get you back home.</h1>
            <p>The page you were looking for may have moved. You can return to Binyan Shalem now, or we’ll take you there automatically.</p>
            <a class="return-link" href="/">Return to the homepage</a>
            <span class="countdown" id="countdown" role="status" aria-live="polite">Returning in 5 seconds…</span>
        </section>
    </main>

    <script>
        const countdownElement = document.getElementById("countdown");
        let secondsRemaining = 5;

        const countdownTimer = window.setInterval(() => {
            secondsRemaining -= 1;
            countdownElement.textContent = `Returning in ${secondsRemaining} second${secondsRemaining === 1 ? "" : "s"}…`;

            if (secondsRemaining === 0) {
                window.clearInterval(countdownTimer);
                window.location.replace("https://www.binyan-shalem.com/");
            }
        }, 1000);
    </script>
</body>
</html>
